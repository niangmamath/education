name: studentconnect-dev

# Second stack, entièrement isolé de celui du dossier StudentConnect (branche
# deploy-ngrok, démo en cours) : réseau, volumes et noms de conteneurs propres
# à ce projet Compose, ports hôtes distincts. Ne pas fusionner avec
# docker-compose.yml, qui reste la référence pour le dossier de démo.

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5434}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks: [studentconnect_dev_network]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6380}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [studentconnect_dev_network]

  storage:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    ports:
      - "127.0.0.1:${S3_PORT:-9002}:9000"
      - "127.0.0.1:${S3_CONSOLE_PORT:-9003}:9001"
    volumes:
      - storage_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks: [studentconnect_dev_network]

  storage-init:
    image: minio/mc:latest
    restart: "no"
    depends_on:
      storage:
        condition: service_healthy
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET_H5P_PACKAGES: ${S3_BUCKET_H5P_PACKAGES}
      S3_BUCKET_H5P_RUNTIME: ${S3_BUCKET_H5P_RUNTIME}
      S3_BUCKET_MEDIA: ${S3_BUCKET_MEDIA}
      S3_BUCKET_PRIVATE_EVIDENCE: ${S3_BUCKET_PRIVATE_EVIDENCE}
      S3_BUCKET_THUMBNAILS: ${S3_BUCKET_THUMBNAILS}
    entrypoint: ["/bin/sh", "/scripts/create_minio_buckets.sh"]
    volumes:
      - ./infrastructure/scripts/create_minio_buckets.sh:/scripts/create_minio_buckets.sh:ro
    networks: [studentconnect_dev_network]

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    env_file: [.env]
    ports:
      - "127.0.0.1:${API_PORT:-8100}:8000"
    volumes:
      - ./apps/api:/app
      - content_runtime:/srv/content
      - ./experiments/h5p-spike:/opt/h5p-spike:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/live"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks: [studentconnect_dev_network]

  content:
    image: nginx:1.27-alpine
    restart: unless-stopped
    environment:
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3100}
    ports:
      - "127.0.0.1:${CONTENT_PORT:-8181}:80"
    volumes:
      - ./infrastructure/nginx/content-origin.conf.template:/etc/nginx/templates/default.conf.template:ro
      - content_runtime:/srv/content:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [studentconnect_dev_network]

  worker:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.worker
    restart: unless-stopped
    env_file: [.env]
    volumes:
      - ./apps/api:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
    command: ["celery", "-A", "app.workers.celery_app:celery_app", "worker", "--loglevel=INFO"]
    networks: [studentconnect_dev_network]

networks:
  studentconnect_dev_network:
    name: studentconnect_dev_network
    driver: bridge

volumes:
  postgres_data:
    name: studentconnect_dev_postgres_data
  redis_data:
    name: studentconnect_dev_redis_data
  storage_data:
    name: studentconnect_dev_storage_data
  content_runtime:
    name: studentconnect_dev_content_runtime
