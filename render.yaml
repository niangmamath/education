# Blueprint de démonstration StudentConnect.
#
# Ce qu'il déploie : l'API, le web, PostgreSQL, Redis, un stockage objet
# auto-hébergé (MinIO) et l'origine de contenu H5P. Le parcours complet
# fonctionne désormais, contenus H5P compris.
#
# Ce qui a changé depuis la première version de ce blueprint : l'origine de
# contenu n'était pas déployée ici, faute de pouvoir partager un disque avec
# l'API — Render, comme la plupart des hébergeurs multi-services, attache un
# disque persistant à un seul service (vérifié sur render.com/docs/disks).
# Le déploiement écrit désormais dans un bucket (`app/content/deploy.py`), et
# l'origine de contenu récupère chaque fichier par une URL que l'API signe à
# la demande (`app/api/v1/internal.py`) — plus aucun disque à partager.
#
# **Ce que ce choix coûte, honnêtement** : MinIO a besoin d'un disque pour
# lui-même, et un disque Render n'existe que sur un service payant. Ce
# blueprint n'est donc plus entièrement gratuit dès que `studentconnect-storage`
# est inclus — c'est le prix d'héberger soi-même le stockage plutôt que de
# payer un fournisseur managé (Cloudflare R2, Backblaze B2...), qui n'aurait
# demandé aucun disque ici mais une facture séparée.
#
# **Six réglages restent à faire à la main après l'import du blueprint**,
# faute d'un mécanisme Render pour les dériver automatiquement :
#   1. `WEB_ORIGIN` sur `studentconnect-content` : l'adresse publique réelle
#      de `studentconnect-web` une fois assignée (Render ne permet pas de la
#      référencer dynamiquement depuis un autre service).
#   2. `CONTENT_ORIGIN_URL` sur `studentconnect-api` : l'adresse publique
#      réelle de `studentconnect-content`. Oubliée une première fois — sans
#      elle, l'API renvoie au navigateur d'un enfant l'adresse par défaut du
#      code (`http://localhost:8081`), et le contenu H5P échoue avec
#      « localhost a refusé de se connecter ».
#   3. `API_ORIGIN` sur `studentconnect-content` : l'adresse publique réelle
#      de `studentconnect-api`. L'adresse *privée*, câblée via `fromService`
#      dans un essai précédent, se réassigne à chaque redéploiement de
#      l'API — elle a fini par ne plus rien nommer une fois l'API
#      reconstruite après le déploiement de l'origine de contenu.
#   4. `S3_ENDPOINT_URL` et `S3_PUBLIC_ENDPOINT_URL` sur `studentconnect-api` :
#      l'adresse publique réelle de `studentconnect-storage`. Même
#      mésaventure que le point 3, avec le stockage cette fois — sa
#      première version était un service privé (`pserv`), dont l'adresse
#      s'est aussi réassignée à chaque redéploiement ; il est devenu public
#      pour cette raison même (voir son commentaire plus bas).
#   5. Les identifiants du stockage (`MINIO_ROOT_USER`/`MINIO_ROOT_PASSWORD`
#      sur `studentconnect-storage`, `S3_ACCESS_KEY`/`S3_SECRET_KEY` sur
#      `studentconnect-api`) : à poser aux **mêmes valeurs** des deux côtés,
#      Render ne permettant pas à un service de lire la variable d'un autre.
#   6. Un paquet H5P se déploie toujours par la commande dédiée, jamais par
#      ce blueprint (ADR-012, condition 4 : aucun CLI H5P dans le chemin de
#      production) — via le Shell d'un service qui l'offre :
#        python -m app.catalog deploy-runtime ...
#        python -m app.catalog register ...
#        python -m app.catalog deploy ...
#
# **Écrit sans compte Render, corrigé avec un vrai compte.** Une première
# version, écrite à partir de la seule documentation, a buté sur deux
# comportements qu'aucune lecture n'aurait révélés sans un déploiement réel :
# un `dockerCommand` enchaînant plusieurs commandes avec `&&` n'atteint jamais
# un shell qui les interprète comme telles (Render le rend à `sh` comme une
# seule commande introuvable), et chaque service doit écouter exactement sur
# le `$PORT` que Render lui assigne — l'image MinIO publiée, liée en dur sur
# 9000, ne le fait pas. Les deux corrigés (`apps/api/docker-entrypoint.sh`,
# `infrastructure/minio/`), un nom de service Docker Compose (`api`) codé en
# dur dans le gabarit nginx corrigé au passage. Encore jamais suivi jusqu'à un
# déploiement entièrement vert ; un import mérite toujours d'être suivi de
# près.
#
# L'examen d'initiation, lui, ne dépend d'aucune origine de contenu : un
# enfant inscrit passe son examen et repart avec un diagnostic complet même
# si les trois réglages ci-dessus n'ont pas encore été faits.

databases:
  - name: studentconnect-db
    databaseName: studentconnect
    user: studentconnect
    plan: free

services:
  - type: redis
    name: studentconnect-redis
    plan: free
    # Les sessions et les tickets vivent ici. Rien n'y est durable par nature :
    # une session perdue est une reconnexion, pas une donnée perdue.
    ipAllowList: []

  # Stockage objet auto-hébergé : les paquets H5P vérifiés et le runtime
  # déployé (bibliothèques, contenus) vivent ici plutôt que sur un disque
  # partagé avec l'origine de contenu.
  #
  # Un service **public** (`type: web`), pas privé — deuxième correction sur
  # ce service. Un `pserv` semblait le bon choix, rien d'autre que l'API et
  # l'origine de contenu n'ayant besoin de lui parler ; mais son adresse
  # privée se réassigne à chaque redéploiement du service, et une fois
  # storage reconstruit après le correctif de port qui suit, l'adresse
  # câblée dans l'API ne nommait plus rien (« could not be resolved »).
  # Rendre le stockage public lui donne l'adresse stable des autres
  # services — exactement le compromis qu'AWS S3, Cloudflare R2 et tout
  # stockage S3 managé font déjà : un point d'accès joignable de partout,
  # protégé par les identifiants plutôt que par l'isolation réseau. Rien
  # n'y est lisible sans la bonne clé.
  #
  # Une image construite plutôt que `minio/minio:latest` telle quelle, sur
  # constat : Render attend qu'un service écoute exactement sur le `$PORT`
  # qu'il assigne, et l'image publiée l'ignore, liée en dur sur 9000
  # (« Port scan timeout reached, no open ports detected »). Le Dockerfile
  # remplace l'entrée de l'image par un script qui lit `$PORT`.
  - type: web
    name: studentconnect-storage
    runtime: docker
    dockerfilePath: ./infrastructure/minio/Dockerfile
    dockerContext: ./infrastructure/minio
    healthCheckPath: /minio/health/live
    plan: starter
    disk:
      name: storage-data
      mountPath: /data
      sizeGB: 5
    envVars:
      # À poser à la main après l'import, à la même valeur que
      # S3_ACCESS_KEY / S3_SECRET_KEY sur studentconnect-api ci-dessous —
      # Render ne permet pas à un service de lire la variable d'un autre.
      - key: MINIO_ROOT_USER
        sync: false
      - key: MINIO_ROOT_PASSWORD
        sync: false

  - type: web
    name: studentconnect-api
    runtime: docker
    plan: free
    dockerfilePath: ./apps/api/Dockerfile.dev
    dockerContext: ./apps/api
    healthCheckPath: /health/live
    # Trois étapes avant de servir une requête : les buckets existent (rien
    # d'équivalent au `storage-init` du compose local n'existe ici), le schéma
    # est à jour, puis le serveur démarre — dans `docker-entrypoint.sh`, pas
    # ici. Un premier essai chaînait les trois avec `sh -c "... && ... && ..."`
    # directement dans `dockerCommand` : Render l'a rendu à `sh` comme une
    # seule commande de plusieurs mots, jamais interprétée comme un
    # enchaînement (`... : not found`). Un unique exécutable ne peut pas
    # subir la même mésaventure, ici ou ailleurs.
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: studentconnect-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: studentconnect-redis
          type: redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      # Le cookie de session est posé par le web sur sa propre origine ; l'API
      # n'est jamais appelée par un navigateur. CORS n'a donc personne à laisser
      # entrer, et la liste reste vide.
      - key: CORS_ORIGINS
        value: "[]"
      # L'adresse publique de studentconnect-storage, schéma compris. Son
      # adresse *privée*, câblée ici via `fromService` dans un essai
      # précédent, s'est réassignée au premier redéploiement du stockage
      # (le correctif de port qui suit) et n'a plus jamais nommé la bonne
      # instance depuis — le stockage est maintenant public pour cette
      # raison même (voir son commentaire plus haut), donc il n'y a plus
      # qu'une seule adresse à poser, identique aux deux variables.
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_PUBLIC_ENDPOINT_URL
        sync: false
      - key: S3_REGION
        value: us-east-1
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
      - key: S3_BUCKET_H5P_PACKAGES
        value: studentconnect-h5p-packages
      - key: S3_BUCKET_H5P_RUNTIME
        value: studentconnect-h5p-runtime
      - key: S3_BUCKET_MEDIA
        value: studentconnect-media
      - key: S3_BUCKET_PRIVATE_EVIDENCE
        value: studentconnect-private-evidence
      - key: S3_BUCKET_THUMBNAILS
        value: studentconnect-thumbnails
      # L'URL que l'API compose dans `play_url`, renvoyée au navigateur pour
      # ouvrir l'iframe d'un contenu (app/api/v1/assignments.py). Jamais
      # câblée ici : sans elle, la valeur par défaut du code
      # (http://localhost:8081) part telle quelle jusqu'au navigateur d'un
      # vrai enfant, qui essaie alors de joindre sa propre machine —
      # « localhost a refusé de se connecter ». À poser à la main, l'adresse
      # publique réelle de studentconnect-content, comme WEB_ORIGIN plus bas.
      - key: CONTENT_ORIGIN_URL
        sync: false

  # L'origine de contenu, ADR-012 condition 5. Son image embarque le lecteur
  # H5P à la construction (infrastructure/nginx/Dockerfile) : rien de local à
  # préparer sur cette machine, contrairement à l'ancienne version de ce
  # service qui comptait sur un dossier du poste de développement.
  - type: web
    name: studentconnect-content
    runtime: docker
    plan: free
    dockerfilePath: ./infrastructure/nginx/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      # L'adresse publique réelle de studentconnect-web, à poser après avoir
      # vu l'URL que Render lui assigne — sans quoi `frame-ancestors` refuse
      # d'afficher un contenu dans l'espace Élève. Voir l'en-tête du fichier.
      - key: WEB_ORIGIN
        sync: false
      # L'adresse publique de studentconnect-api, schéma compris
      # (https://studentconnect-api.onrender.com). Deux essais avant celui-ci
      # ont échoué : un nom « api » codé en dur (n'existe que sous Docker
      # Compose), puis l'adresse *privée* de l'API via `fromService` —
      # réassignée à chaque redéploiement de l'API, elle a fini par ne plus
      # rien nommer une fois ce service reconstruit. L'adresse publique ne
      # bouge pas de la même façon ; Render ne permettant pas de la
      # référencer dynamiquement, elle se pose ici à la main.
      - key: API_ORIGIN
        sync: false
      # Déclenche le script officiel de l'image nginx qui lit le résolveur DNS
      # déjà configuré par Render et l'expose en `NGINX_LOCAL_RESOLVERS`, dont
      # le gabarit a besoin pour `proxy_pass` vers une URL signée. Aucune
      # valeur à deviner ici, contrairement à un `resolver` codé en dur.
      - key: NGINX_ENTRYPOINT_LOCAL_RESOLVERS
        value: "1"

  - type: web
    name: studentconnect-web
    runtime: node
    plan: free
    rootDir: .
    # `corepack enable` tried to replace the `pnpm` Render's Node
    # environment already provides at a path that turned out to be
    # read-only there (`EROFS: read-only file system, unlink '/usr/bin/pnpm'`)
    # — Render provisions the version named by `packageManager` in
    # package.json on its own, so activating corepack by hand was not just
    # unnecessary, it broke the build outright.
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @studentconnect/web run build
    startCommand: pnpm --filter @studentconnect/web run start
    envVars:
      # Lu par le serveur Next et jamais par le navigateur : `API_URL` n'est pas
      # `NEXT_PUBLIC_`, et c'est la décision d'ADR-016.
      #
      # L'adresse privée (`fromService: hostport`) semblait la bonne
      # approche — c'est ce qui relie l'API et le web sur le réseau interne
      # de Render — mais `fetch()` depuis ce service échouait dessus alors
      # que la même correction (résolution différée, `resolver` explicite)
      # avait déjà réglé un problème très proche côté nginx. Plutôt que de
      # chasser une troisième fois une résolution DNS interne capricieuse,
      # l'adresse publique de l'API : un aller-retour par internet plutôt
      # que le réseau privé, mais fiable, et toujours en HTTPS.
      - key: API_URL
        sync: false
      - key: NODE_ENV
        value: production
