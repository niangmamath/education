name: API CI
on:
  pull_request:
    paths: ["apps/api/**", ".github/workflows/api-ci.yml"]
  push:
    branches: [main]
    paths: ["apps/api/**", ".github/workflows/api-ci.yml"]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: studentconnect_test
          POSTGRES_USER: studentconnect
          POSTGRES_PASSWORD: test_only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U studentconnect -d studentconnect_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    defaults:
      run:
        working-directory: apps/api
    env:
      DATABASE_URL: postgresql+asyncpg://studentconnect:test_only@localhost:5432/studentconnect_test
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/1
      CELERY_RESULT_BACKEND: redis://localhost:6379/2
      SECRET_KEY: ci-only-not-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            apps/api/requirements.txt
            apps/api/requirements-step03.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt -r requirements-step03.txt
      - run: ruff format --check .
      - run: ruff check .
      - run: mypy app --ignore-missing-imports
      - run: alembic upgrade head
      - run: alembic check
      - run: alembic downgrade base
      - run: alembic upgrade head
      - run: pytest -q
