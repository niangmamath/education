name: Web CI
on:
  pull_request:
    paths: ["apps/web/**", "packages/**", "pnpm-lock.yaml", ".github/workflows/web-ci.yml"]
  push:
    branches: [main]
    paths: ["apps/web/**", "packages/**", "pnpm-lock.yaml", ".github/workflows/web-ci.yml"]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @studentconnect/web run typecheck
      - run: pnpm --filter @studentconnect/web run lint
      - run: pnpm --filter @studentconnect/web run build
