<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Activité</title>
<link rel="stylesheet" href="/player/styles/h5p.css">
<style>
  body { margin: 0; font-family: system-ui, sans-serif; background: #fff; color: #17202a; }
  #h5p { min-height: 320px; }
  #erreur { display: none; padding: 16px; color: #a40000; }
</style>
</head>
<body>
<div id="h5p"></div>
<p id="erreur" role="alert"></p>
<script src="/player/main.bundle.js"></script>
<script>
// This page runs on the content origin and knows nothing about anyone. It reads
// the content to play and the ticket that opens it from its own URL, and hands
// every xAPI statement up to the application through postMessage — the only
// channel two origins are allowed, and the reason the separation costs nothing.
(function () {
  var params = new URLSearchParams(window.location.search);
  var digest = params.get('c');
  var ticket = params.get('t');
  var erreur = document.getElementById('erreur');

  function fail(message) {
    erreur.textContent = message;
    erreur.style.display = 'block';
  }

  function uniqueId() {
    if (window.crypto && window.crypto.randomUUID) {
      return window.crypto.randomUUID();
    }
    // Older browsers only: enough to tell two statements apart within one
    // session, which is all the server asks of this value.
    return 'sc-' + Date.now().toString(16) + '-' + Math.random().toString(16).slice(2);
  }

  if (!digest || !ticket) {
    fail("Contenu non spécifié.");
    return;
  }

  // The ticket is a path segment, not a query parameter. The player builds its
  // own asset URLs by joining paths — a query string is not a path segment and
  // was dropped the moment it asked for anything of its own, so every asset
  // arrived at the origin without a ticket and was refused. A prefix survives
  // the joining by construction, which is why the ticket lives here now.
  var prefix = '/t/' + encodeURIComponent(ticket);
  var options = {
    h5pJsonPath: prefix + '/content/' + encodeURIComponent(digest),
    librariesPath: prefix + '/libraries',
    // The player itself carries no content, so it is served without a ticket.
    frameJs: '/player/frame.bundle.js',
    frameCss: '/player/styles/h5p.css',
    customJs: []
  };

  new H5PStandalone.H5P(document.getElementById('h5p'), options)
    .then(function () {
      if (window.H5P && window.H5P.externalDispatcher) {
        window.H5P.externalDispatcher.on('xAPI', function (event) {
          var statement = event.data.statement || {};
          // Every statement leaves here with an identifier, because the server
          // uses it to recognise a retransmission. H5P does not always set one,
          // and letting the server mint it instead would turn every retry into a
          // second answer.
          if (!statement.id) {
            statement.id = uniqueId();
          }
          // The parent decides what to do with it; this page never talks to the
          // API itself, and holds no credential that would let it.
          window.parent.postMessage(
            { type: 'studentconnect:xapi', statement: statement },
            '*'
          );
        });
      }
      window.parent.postMessage({ type: 'studentconnect:ready' }, '*');
    })
    .catch(function (error) {
      fail("Ce contenu n’a pas pu être ouvert.");
      window.parent.postMessage({ type: 'studentconnect:error' }, '*');
      console.error(error);
    });
})();
</script>
</body>
</html>
