[project]
name = "studentconnect-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.31.0",
    "python-multipart==0.0.9",
    "pydantic==2.9.0",
    "pydantic-settings==2.7.1",
    "python-dotenv==1.0.1",
    "sqlalchemy==2.0.41",
    "alembic==1.14.0",
    "psycopg2-binary==2.9.9",
    "redis==5.2.0",
    "celery==5.4.0",
    "anyio==4.6.0",
    "httpx==0.27.2",
    "structlog==24.4.0",
    "python-json-logger==2.0.7",
    "email-validator==2.2.0",
    "python-dateutil==2.9.0.post0",
    "argon2-cffi==25.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.5",
    "pytest-asyncio==0.24.0",
    "pytest-cov==4.1.0",
    "mypy==1.15.0",
    "ruff==0.6.9",
    "black==24.8.0",
    "isort==5.13.2",
    "autoflake==2.3.1",
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.mypy]
# The configuration lives here rather than in a flag of the CI workflow. It was
# a `--ignore-missing-imports` passed only by the workflow, so `mypy app` run by
# hand reported two errors that CI never showed. A check that disagrees with
# itself depending on where it runs is worse than no check.
python_version = "3.12"

# Named one by one instead of ignoring every missing import: celery and boto3
# genuinely ship no stubs, and saying so here means the next dependency that
# lacks them is reported rather than silently swallowed.
[[tool.mypy.overrides]]
module = ["celery.*", "boto3.*", "botocore.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
